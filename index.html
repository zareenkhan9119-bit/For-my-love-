<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100608">
<title>For My Love — A Little Love Letter</title>
<style>
:root{--bg:#100608;--wine:#3b0b16;--red:#9f1830;--rose:#d9a0a2;--paper:#f5e9df;--muted:#c9aeb0}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--paper);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 12%,#49101d 0%,#210a10 36%,#0d0508 78%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#f8d8d5 .8px,transparent 1px),radial-gradient(#b66a76 .7px,transparent 1px);background-size:83px 91px,127px 139px;background-position:0 0,40px 60px;opacity:.32;animation:glow 5s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.65}}
main{width:min(100% - 32px,620px);margin:auto;text-align:center;position:relative;padding:52px 0 30px}
.eyebrow{font:9px Arial,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#d7a6a8}
h1{font-weight:400;font-size:clamp(43px,10vw,72px);line-height:.98;letter-spacing:-.035em;margin:20px 0 16px;text-shadow:0 5px 30px #0008}
h1 em{font-weight:400;color:#d68b91}
.intro{max-width:390px;margin:0 auto;color:#ddc7c5;font-size:15px;line-height:1.9}
.rule{width:54px;height:1px;background:linear-gradient(90deg,transparent,#c27b82,transparent);margin:25px auto}
.bouquet{position:relative;width:min(100%,390px);height:300px;margin:10px auto 0;filter:drop-shadow(0 18px 23px #0009)}
.stems{position:absolute;left:50%;bottom:27px;width:3px;height:170px;background:linear-gradient(90deg,#243d2b,#77906a,#263e2b);transform-origin:bottom;border-radius:4px}
.stems.s1{transform:rotate(-35deg);height:152px}.stems.s2{transform:rotate(-21deg);height:180px}.stems.s3{transform:rotate(-7deg);height:194px}.stems.s4{transform:rotate(9deg);height:184px}.stems.s5{transform:rotate(25deg);height:165px}.stems.s6{transform:rotate(39deg);height:145px}
.leaf{position:absolute;width:47px;height:20px;background:linear-gradient(140deg,#8da078,#263e2b);border-radius:100% 0 100% 0;bottom:92px;left:calc(50% - 52px);transform:rotate(18deg);box-shadow:inset 0 0 5px #d5d5a333}
.leaf.l2{left:calc(50% + 8px);bottom:115px;transform:scaleX(-1) rotate(18deg)}
.rose{position:absolute;left:50%;top:28px;width:83px;height:83px;transform:translateX(-50%);animation:appear 1.2s cubic-bezier(.2,.8,.2,1) both}
.rose.r1{left:22%;top:84px;scale:.75;animation-delay:.18s}.rose.r2{left:78%;top:80px;scale:.76;animation-delay:.32s}.rose.r3{left:38%;top:35px;scale:.88;animation-delay:.48s}.rose.r4{left:63%;top:25px;scale:.96;animation-delay:.62s}.rose.r5{left:50%;top:4px;scale:1.05;animation-delay:.75s}
@keyframes appear{from{opacity:0;transform:translate(-50%,20px) scale(.15) rotate(-25deg)}to{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}}
.petal{position:absolute;left:25px;top:3px;width:34px;height:52px;border-radius:52% 52% 44% 44%;transform-origin:50% 39px;background:radial-gradient(ellipse at 35% 25%,#e8797b 0%,#b9273c 40%,#650c20 100%);box-shadow:inset -4px -5px 8px #3b061566,inset 2px 2px 5px #ffc0b244}
.petal:nth-child(2){transform:rotate(45deg)}.petal:nth-child(3){transform:rotate(90deg)}.petal:nth-child(4){transform:rotate(135deg)}.petal:nth-child(5){transform:rotate(180deg)}.petal:nth-child(6){transform:rotate(225deg)}.petal:nth-child(7){transform:rotate(270deg)}.petal:nth-child(8){transform:rotate(315deg)}
.rosecore{position:absolute;left:34px;top:29px;width:17px;height:20px;border-radius:50%;background:radial-gradient(#f08b83,#8c1027 70%);box-shadow:0 0 10px #ed788044}
.wrap{position:absolute;bottom:5px;left:50%;width:205px;height:120px;transform:translateX(-50%);background:linear-gradient(115deg,#d7b5a9,#6c3038 28%,#2a1118 51%,#a36b69 80%,#e2c4b2);clip-path:polygon(0 0,100% 0,73% 100%,27% 100%);border-top:1px solid #e9c9b7}
.wrap:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff3 0%,transparent 28%,#0003 50%,#fff2 83%,transparent)}
bow{display:none}.ribbon{position:absolute;bottom:4px;left:50%;width:55px;height:25px;transform:translateX(-50%);border:5px solid #c68a8d;border-radius:50%;filter:drop-shadow(0 2px 3px #000)}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:-7px;width:24px;height:25px;border:4px solid #c68a8d;border-radius:80% 20% 80% 20%}.ribbon:before{left:-25px;transform:rotate(25deg)}.ribbon:after{right:-25px;transform:scaleX(-1) rotate(25deg)}
button{cursor:pointer;border:1px solid #b76a75;background:linear-gradient(135deg,#5b101e,#2a0b13);color:#f8e9e2;padding:15px 25px;border-radius:2px;font:9px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;box-shadow:0 8px 28px #0006;transition:.25s}
button:hover{transform:translateY(-3px);border-color:#e0a2a2;box-shadow:0 12px 35px #0009}
.card{display:none;position:relative;margin:28px auto 0;max-width:510px;padding:38px 32px 30px;text-align:left;color:#44232a;background:linear-gradient(145deg,#f8eee5,#ead9d0);box-shadow:0 25px 80px #0009;animation:rise .7s ease both}
.card:before{content:"";position:absolute;inset:10px;border:1px solid #c9a5a0;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.kicker{font:9px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#9c4d5a}
h2{font-weight:400;font-size:32px;margin:17px 0 14px;color:#5c1b2b}
.message{font-size:16px;line-height:1.95;white-space:pre-line;color:#593b3d}
.sign{font-style:italic;color:#9c4d5a;margin-top:23px}
.card button{position:relative;margin-top:25px;color:#f8e9e2}
.counter{text-align:right;font:9px Arial,sans-serif;letter-spacing:.18em;color:#a17c7c;margin-top:13px}
.footer{font:9px Arial,sans-serif;letter-spacing:.25em;color:#b98b91;margin:32px auto 0}
.floating{position:fixed;bottom:-30px;color:#b94c5d;opacity:0;animation:float 9s linear infinite;pointer-events:none;text-shadow:0 0 10px #a52b41}
@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-110vh) rotate(45deg);opacity:0}}
@media(max-width:420px){main{padding-top:38px}.bouquet{height:270px}.card{padding:32px 24px}.message{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><div class="stars"></div>
<main>
<section id="opening">
<div class="eyebrow">a little love letter · made just for you</div>
<h1>To my <em>favourite</em><br>human.</h1>
<p class="intro">A bouquet made of roses, a few words from my heart, and all the love I wish I could wrap around you.</p>
<div class="rule"></div>
<div class="bouquet" aria-label="An animated bouquet of deep red roses">
<div class="stems s1"></div><div class="stems s2"></div><div class="stems s3"></div><div class="stems s4"></div><div class="stems s5"></div><div class="stems s6"></div>
<div class="leaf"></div><div class="leaf l2"></div>
<div class="rose r1"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="rosecore"></b></div>
<div class="rose r2"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="rosecore"></b></div>
<div class="rose r3"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="rosecore"></b></div>
<div class="rose r4"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="rosecore"></b></div>
<div class="rose r5"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="rosecore"></b></div>
<div class="wrap"></div><div class="ribbon"></div>
</div>
<button id="open">open your little surprise&nbsp; ♥</button>
</section>
<article class="card" id="card" aria-live="polite">
<div class="kicker">a note from my heart · <span id="number">01</span></div>
<h2 id="title"></h2><p class="message" id="message"></p>
<div class="sign" id="signature"></div>
<button id="next">the next little note →</button><div class="counter" id="counter"></div>
</article>
<div class="footer">written in code · wrapped in love</div>
</main>
<script>
const HIS_NAME = "Jaana"; // Add his nickname here.
const YOUR_NAME = "zara"; // Add your name or nickname here.
const notes = [
{title:"The things I admire about you",message:`${HIS_NAME}, I hope you know how much I admire the person you are. Your strength, your heart, the way you keep showing up, and the little things you do without even realising how much they mean to me. I see your efforts. I see your goodness. And I am so proud of you.`},
{title:"My favourite kind of happiness",message:"Some of my happiest moments are the simple ones with you. The conversations that go on longer than planned, the silly little things that make us laugh, and the comfort of knowing I get to share a part of my day with you. I keep those moments somewhere very special in my heart."},
{title:"A moment I keep replaying",message:"[My favourite memories are the moments when you understood me without me having to explain a single thing. The way you show me love through your little gestures, your generosity, and the way you make me feel understood — those are the moments I wish I could live a thousand times again.]"},
{title:"For the days you forget",message:"You don't have to be strong every second. You don't have to solve everything or carry the whole world on your shoulders. I hope you give yourself the same kindness you give to the people you love. I am always cheering for you."},
{title:"My favourite person",message:"You are so much more than a person I love. You are my safe place, my happiness, my favourite notification, and one of the biggest blessings in my life. I don't need a special day to appreciate you, but I'm glad today gives me another reason to say it."},
{title:"If I could choose again…",message:"I would still choose you — in the ordinary days, in the exciting days, and in all the in-between moments. I hope life brings you every beautiful thing your heart is working for. Happy Men's Day, my everything. I love you."}
];
let index=0;const $=id=>document.getElementById(id);
function render(){const n=notes[index];$("number").textContent=String(index+1).padStart(2,"0");$("title").textContent=n.title;$("message").textContent=n.message;$("signature").textContent="always yours, "+YOUR_NAME;$("counter").textContent=`note ${index+1} of ${notes.length}`;$("next").textContent=index===notes.length-1?"read them again ♥":"next little note →";$("card").style.animation="none";void $("card").offsetWidth;$("card").style.animation="rise .7s ease both"}
$("open").addEventListener("click",()=>{$("opening").style.display="none";$("card").style.display="block";render()});
$("next").addEventListener("click",()=>{index=(index+1)%notes.length;render()});
for(let i=0;i<14;i++){let h=document.createElement("span");h.className="floating";h.textContent="✦";h.style.left=Math.random()*100+"%";h.style.animationDelay=Math.random()*9+"s";h.style.fontSize=10+Math.random()*12+"px";document.body.appendChild(h)}
</script></body></html>
